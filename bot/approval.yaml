# The pack's approval, which a machine names as a hook before the jobs it marks
# for approval. It asks the question in every place of `ask` at once, each a
# bot's placed chat/ask, with yes and no, naming the machine that asks, the
# held job, who asked and what was asked. The hook's input gives:
#
#   job        the held job, as the hook reads it: "${job}"
#   ask        the places, each { at, in }: the question's location, such as
#              grouse/slack/chat/ask, and where it is posted there: a channel,
#              a thread or a chat
#   approvers  the scope a press needs to count
#   within     how long it waits, by default 7d; no press in time is no
#   asker      the email of the person who asked, or <service>:<their ID>, shown, and whose own press is refused
#   request    what was asked, shown quoted
#
# Each question is given the ballot { at: ballot, key: <this run's ID> }, so
# the first answer that counts closes the others. That answer is the
# approval's; with none, the answer is no. A place whose question fails leaves
# the others asking.
flow: approval
description: Asks people in one or more places whether a held job may run.
title: "Approve ${input.job.name}"
input:
  job: map
  ask: list
  approvers: string
  within: "string?"
  asker: "string?"
  request: "string?"
allow: [send:ballot]
stages:
  brief:
    job: { script: ./approval.js, input: { do: brief, job: "${input.job}", asker: "${input.asker || ''}", request: "${input.request}" } }
  question:
    each: "${input.ask}"
    job:
      machine:
        flow: place
        input: { at: string, question: map }
        allow: ["send:${input.at}"]
        stages:
          asking: { job: { call: { at: "${input.at}" }, input: "${input.question}" } }
        output: ${stages.asking.output}
      input:
        at: "${item.at}"
        question:
          in: "${item.in}"
          text: "${input.job.machine} wants to run ${input.job.name}.\n${stages.brief.output}"
          choices: ["yes", "no"]
          approvers: "${input.approvers}"
          asker: "${input.asker || ''}"
          within: "${input.within || '7d'}"
          ballot: { at: ballot, key: "${run.id}" }
  # Ends the ballot once every question has ended.
  over:
    follows: [question]
    job: { send: { to: { at: ballot, key: "${run.id}" }, event: over } }
  # The first answer that counts in any place.
  answer:
    job: { script: ./approval.js, input: { do: answer, asked: "${stages.question.output}" } }
output: ${stages.answer.output}
