# The conversation: one run for each thread and person, which a router starts
# with the first message it sends to a key `<service>:<chat>:<user>:assistant`.
#
# 1. A message is added to a list, and messages that come while the bot
#    answers are added to the list too.
# 2. The turn answers the whole list: the lookup gives the person's name,
#    email and scopes, the status shows, the files are downloaded, the prompt
#    gives the model the messages, the thread and the files, and the agent at
#    agents/assistant answers with the toolkits those scopes allow, told how
#    to write for the service.
# 3. Slack's status is cleared, and the reply is posted where the messages
#    came from. A failed turn posts "That could not be answered.", and the
#    next turn starts a new conversation with the agent. So does a reply whose
#    post fails.
# 4. A stop cancels the turn, the agent's run and its tools with it, and posts
#    "Stopped.". A stop that comes while a message is added is kept, and
#    cancels the turn as it starts. A stop with no turn coming is dropped.
#
# A status or a post that fails does not fail the turn or its reply: the
# turn's and the reply's output read the failure, and the record holds its
# error.
#
# A message from `later`, which the agent's tool later sends after a wait, is
# answered as one from its person, marked `later`.
#
# A run with no message for a day ends. Each message added costs a job, and
# each kept message offered while the turn starts costs one more. The run
# keeps at most 100 messages that come during a turn; a 101st is dropped.
statechart: conversation
description: Answers one person in one thread with the agent at agents/assistant.
lifetime: keyed
receive: { message: [BOT/*/BOT, later], stop: [BOT/*/BOT] }
title: "${input.service} ${input.place}: ${String(input.text || '').split('\\n')[0]}"
initial: idle
states:
  idle:
    timers: { quiet: 1d }
    on:
      message: adding
      quiet: over
      # A stop that started the run, since no conversation was running, ends it.
      stop: { when: "${!states.adding.output}", go: over }
  adding:
    defer: [message, stop]
    job:
      script: .packs/shared/fold.js
      input:
        list: "${event.name === 'message' ? states.adding.output || [] : []}"
        add: "${event.name === 'message' ? [event.data] : []}"
      restart: { after: failure, limit: 3 }
    on: { done: gathering, failed: broken }
  # The messages kept while a state deferred them are offered here, each back
  # to adding, before this job's end.
  gathering:
    defer: [stop]
    job: { script: .packs/shared/gathered.js, restart: { after: failure, limit: 3 } }
    on:
      message: adding
      done:
        - { go: answering, when: "${states.adding.output.length > 0}" }
        - idle
      failed: broken
  answering:
    defer: [message]
    job:
      input:
        service: "${states.adding.output[0].service}"
        in: "${states.adding.output[0].chat}"
        key: "${run.key}"
        messages: "${states.adding.output}"
        conversation: "${(states.replying.output || {}).conversation}"
      machine:
        flow: turn
        title: "${input.messages.map((m) => m.text).join(' / ')}"
        input: { service: string, in: string, key: string, messages: list, conversation: "any?" }
        allow:
          - send:people/find
          - send:agents/assistant
          - send:BOT/*/files/get
          - send:BOT/slack/assistant/status
          - send:BOT/telegram/chat/status
        stages:
          # A filter, for messages the router sends marked unaddressed, is a
          # stage here such as
          #   filter:
          #     when: "${input.messages.every((m) => m.unaddressed)}"
          #     job: { call: { at: filters/words }, input: { text: "${input.messages.at(-1).text}", words: [build] } }
          # with the asker's when: "${stages.filter.skipped || stages.filter.output.reply.answer}",
          # which skips the asker, and with it the prompt and the answer.
          asker:
            job:
              call: { at: people/find }
              input: { service: "${input.service}", user: "${input.messages[0].user}", name: "${input.messages[0].name || ''}", email: "${input.messages[0].email || ''}" }
          thread:
            job:
              script: .packs/shared/history.js
              files: [.packs/shared/thread.js]
              input: { history: "${input.messages[0].history || null}" }
          format:
            job: { script: .packs/shared/format.js, input: { service: "${input.service}" } }
          # Slack shows a status in a thread, and Telegram in a chat.
          status:
            when: "${input.service === 'telegram' || (input.service === 'slack' && input.in.includes('/'))}"
            job:
              call: { at: "${'BOT/' + input.service + (input.service === 'slack' ? '/assistant/status' : '/chat/status')}" }
              input: { in: "${input.in}", text: Working on it. }
          files:
            when: "${input.messages.some((m) => (m.attachments || []).length > 0)}"
            job:
              call: { at: "${'BOT/' + input.service + '/files/get'}" }
              input: { attachments: "${input.messages.flatMap((m) => m.attachments || [])}" }
          # What the model is shown: the messages, the thread before them and
          # the files.
          prompt:
            when: "${stages.files.skipped || stages.files.output}"
            job:
              script: .packs/shared/prompt.js
              input: { messages: "${input.messages}", name: "${stages.asker.output.name}", thread: "${stages.thread.output}", attachments: "${stages.files.output || []}" }
          answer:
            when: "${stages.files.skipped || stages.files.output}"
            job:
              call: { at: agents/assistant }
              input:
                prompt: "${stages.prompt.output}"
                messages: "${input.messages}"
                thread: "${stages.thread.output}"
                attachments: "${stages.files.output || []}"
                medium: "${input.service}"
                format: "${stages.format.output}"
                asker: "${stages.asker.output}"
                conversation: "${input.conversation}"
                post: "${'BOT/' + input.service + '/chat/post'}"
                back: { at: conversation, key: "${input.key}" }
          # A redactor, which cleans the reply of what may not be posted outside
          # a direct message, is a stage here such as
          #   redact:
          #     when: "${input.messages[0].place !== 'dm'}"
          #     job: { call: { at: redact }, input: { text: "${stages.answer.output.reply || ''}" } }
          # with the output's reply "${stages.redact.skipped ? stages.answer.output.reply : stages.redact.output}".
        output:
          reply: "${(stages.answer.output || {}).reply}"
          conversation: "${(stages.answer.output || {}).conversation}"
          status_failed: "${!!stages.status.failed}"
    on: { done: replying, failed: failing, stop: stopping }
  # A failed turn's reply, with no conversation, so the next turn starts a new
  # one with the agent.
  failing:
    defer: [message]
    output: { reply: That could not be answered., conversation: null }
    on: { done: replying }
  # A stopped turn's reply, to the stop, with the conversation as it was before
  # the turn.
  stopping:
    defer: [message]
    output: { reply: Stopped., answers: "${event.data.answers || ''}", conversation: "${(states.replying.output || {}).conversation}" }
    on: { done: replying }
  # Posts the reply of the turn, or of failing or stopping, which is the data
  # of the event that entered it.
  replying:
    defer: [message]
    job:
      input:
        service: "${states.adding.output[0].service}"
        in: "${states.adding.output[0].chat}"
        answers: "${event.data.answers ?? states.adding.output.at(-1).answers ?? ''}"
        text: "${event.data.reply || ''}"
        conversation: "${event.data.conversation}"
      machine:
        flow: reply
        title: "${input.text.split('\\n')[0] || 'no reply'}"
        input: { service: string, in: string, answers: string, text: string, conversation: "any?" }
        allow: ["send:BOT/*/chat/post", send:BOT/slack/assistant/status]
        stages:
          status:
            when: "${input.service === 'slack' && input.in.includes('/')}"
            job: { call: { at: "${'BOT/' + input.service + '/assistant/status'}" }, input: { in: "${input.in}", text: "" } }
          # Telegram's post replies to answers, the message the reply is to; the
          # other services' posts take it and do not read it.
          post:
            when: "${input.text}"
            job:
              call: { at: "${'BOT/' + input.service + '/chat/post'}" }
              input: { in: "${input.in}", text: "${input.text}", answers: "${input.answers}" }
        output:
          conversation: "${stages.post.failed ? null : input.conversation}"
          post_failed: "${!!stages.post.failed}"
          status_failed: "${!!stages.status.failed}"
    on: { done: adding, failed: adding }
  broken: { end: failed }
  over: { end: done }
