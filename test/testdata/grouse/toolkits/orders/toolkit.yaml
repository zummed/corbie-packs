# The orders app. read_file fixes the project, so the model reads no other
# repository. The tool that changes a file is an entry of the agent, offered
# to a person whose scopes hold orders:write.
toolkit: orders
description: The orders app. How it is deployed, and its settings.
instructions: { include: ./orders.md }
tools:
  read_file: { call: grouse/gitlab/repository/files/read, input: { project: group/orders } }
