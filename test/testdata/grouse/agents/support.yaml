# The agent the conversation calls for each turn. It offers orders to a person
# whose scopes hold orders:read, infra to one whose scopes hold infra:read,
# and change_file to one whose scopes hold orders:write. A held call waits for
# a yes in the channel its meta: names, from someone with the scope it names
# who did not ask, for as long as it names. No press in time is no.
agent: support
description: Answers questions in #support, in direct messages and on orders issues.
include: .packs/bot/agent.yaml
model: { name: claude-sonnet-5-5, service: anthropic, secret: ANTHROPIC_KEY }
system:
  - { include: ./support.md }
  - ${input.format}
hooks:
  approval:
    when: "${job.approve}"
    before:
      machine: .packs/bot/approval.yaml
      input:
        job: "${job}"
        ask: [{ at: grouse/slack/chat/ask, in: "${job.meta.channel}" }]
        approvers: "${job.meta.approvers}"
        within: "${job.meta.within || '7d'}"
        asker: "${input.asker.email}"
        request: "${input.messages.map((m) => (m.later != null ? '(a reminder the bot set) ' : '') + m.text).join('\\n')}"
tools:
  orders: { machine: toolkits/orders/toolkit.yaml, when: "${input.asker.scopes.includes('orders:read')}" }
  infra: { machine: toolkits/infra/toolkit.yaml, when: "${input.asker.scopes.includes('infra:read')}" }
  change_file:
    call: grouse/gitlab/repository/commits/create
    input: { project: group/orders }
    approve: true
    meta: { channel: "#orders-team", approvers: "orders:approve", within: 1d }
    when: "${input.asker.scopes.includes('orders:write')}"
